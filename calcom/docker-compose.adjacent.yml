# Cal.com - Scheduling Platform (usando Postgres central)
# Access: Public (with domain)
# Docs: https://cal.com/docs
#
# REQUER: Rodar `bun setup-databases.ts` para criar database e user

services:
  calcom:
    image: calcom/cal.com:latest
    container_name: calcom
    restart: unless-stopped
    environment:
      # Database (Postgres central)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-calcom}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-hwcwo0ckc08k00g40socsc48}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-calcom}
      - DATABASE_DIRECT_URL=postgresql://${POSTGRES_USER:-calcom}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-hwcwo0ckc08k00g40socsc48}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-calcom}

      # Auth
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - CALENDSO_ENCRYPTION_KEY=${CALENDSO_ENCRYPTION_KEY}

      # URLs
      - NEXT_PUBLIC_WEBAPP_URL=${NEXT_PUBLIC_WEBAPP_URL}
      - NEXTAUTH_URL=${NEXT_PUBLIC_WEBAPP_URL}

      # Email (optional)
      # - EMAIL_FROM=${EMAIL_FROM}
      # - EMAIL_SERVER_HOST=${EMAIL_SERVER_HOST}
      # - EMAIL_SERVER_PORT=${EMAIL_SERVER_PORT}
      # - EMAIL_SERVER_USER=${EMAIL_SERVER_USER}
      # - EMAIL_SERVER_PASSWORD=${EMAIL_SERVER_PASSWORD}

      - CALCOM_TELEMETRY_DISABLED=1
    ports:
      - "3000:3000"
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  coolify:
    external: true
