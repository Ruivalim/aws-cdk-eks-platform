# Outline - Team Wiki
# Access: Public (with domain)
# Docs: https://docs.getoutline.com/s/hosting/

services:
  outline:
    image: docker.getoutline.com/outlinewiki/outline:latest
    container_name: outline
    restart: unless-stopped
    depends_on:
      outline-postgres:
        condition: service_healthy
      outline-redis:
        condition: service_healthy
    environment:
      # Generated secrets (use: openssl rand -hex 32)
      - SECRET_KEY=${SECRET_KEY}
      - UTILS_SECRET=${UTILS_SECRET}

      # Database
      - DATABASE_URL=postgres://outline:${POSTGRES_PASSWORD}@outline-postgres:5432/outline
      - DATABASE_CONNECTION_POOL_MIN=1
      - DATABASE_CONNECTION_POOL_MAX=10
      - PGSSLMODE=disable

      # Redis
      - REDIS_URL=redis://outline-redis:6379

      # App
      - URL=${OUTLINE_URL}
      - PORT=3000
      - FORCE_HTTPS=true

      # File storage (local or S3)
      - FILE_STORAGE=local
      - FILE_STORAGE_LOCAL_ROOT_DIR=/var/lib/outline/data
      # For S3:
      # - FILE_STORAGE=s3
      # - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      # - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      # - AWS_REGION=${AWS_REGION:-us-east-1}
      # - AWS_S3_UPLOAD_BUCKET_NAME=${AWS_S3_BUCKET}
      # - AWS_S3_UPLOAD_BUCKET_URL=${AWS_S3_BUCKET_URL}

      # Auth (choose one)
      # Slack:
      # - SLACK_CLIENT_ID=${SLACK_CLIENT_ID}
      # - SLACK_CLIENT_SECRET=${SLACK_CLIENT_SECRET}

      # Google:
      # - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      # - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}

      # OIDC (generic):
      # - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      # - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      # - OIDC_AUTH_URI=${OIDC_AUTH_URI}
      # - OIDC_TOKEN_URI=${OIDC_TOKEN_URI}
      # - OIDC_USERINFO_URI=${OIDC_USERINFO_URI}
      # - OIDC_DISPLAY_NAME=${OIDC_DISPLAY_NAME:-SSO}

      # Optional
      - DEFAULT_LANGUAGE=pt_BR
      - ENABLE_UPDATES=true
    volumes:
      - outline-data:/var/lib/outline/data
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/_health"]
      interval: 30s
      timeout: 10s
      retries: 3

  outline-postgres:
    image: postgres:15-alpine
    container_name: outline-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=outline
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=outline
    volumes:
      - outline-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "outline", "-U", "outline"]
      interval: 10s
      timeout: 5s
      retries: 5

  outline-redis:
    image: redis:7-alpine
    container_name: outline-redis
    restart: unless-stopped
    volumes:
      - outline-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  outline-data:
  outline-postgres-data:
  outline-redis-data:
