# Backrest - Backup UI for Restic
# Access: Private (Tailscale only)
# Docs: https://github.com/garethgeorge/backrest

services:
  backrest:
    image: garethgeorge/backrest:latest
    container_name: backrest
    restart: unless-stopped
    hostname: backrest
    volumes:
      # Docker volumes to backup (read-only)
      - /var/lib/docker/volumes:/data/docker-volumes:ro
      # Local backup destination (optional)
      - backrest-backups:/data/local-backups
      # Backrest data and config
      - backrest-data:/data
      - backrest-config:/config
      # For PostgreSQL dumps (mount your pg data or dump location)
      - /backups:/data/pg-backups:ro
    environment:
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/data/cache
      - TZ=${TZ:-America/Sao_Paulo}
    ports:
      - "9898:9898"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9898"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  backrest-data:
  backrest-config:
  backrest-backups:
