# Plausible - Privacy-Friendly Analytics
# Access: Public (with domain)
# Docs: https://plausible.io/docs/self-hosting

services:
  plausible:
    image: ghcr.io/plausible/community-edition:latest
    container_name: plausible
    restart: unless-stopped
    depends_on:
      plausible-postgres:
        condition: service_healthy
      plausible-clickhouse:
        condition: service_healthy
    command: sh -c "sleep 10 && /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    environment:
      - DATABASE_URL=postgres://plausible:${POSTGRES_PASSWORD}@plausible-postgres:5432/plausible
      - CLICKHOUSE_DATABASE_URL=http://plausible-clickhouse:8123/plausible_events_db
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - BASE_URL=${BASE_URL}
      - TOTP_VAULT_KEY=${TOTP_VAULT_KEY}
      # Disable registration after first user
      - DISABLE_REGISTRATION=invite_only
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  plausible-postgres:
    image: postgres:16-alpine
    container_name: plausible-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=plausible
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=plausible
    volumes:
      - plausible-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "plausible", "-U", "plausible"]
      interval: 10s
      timeout: 5s
      retries: 5

  plausible-clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: plausible-clickhouse
    restart: unless-stopped
    volumes:
      - plausible-clickhouse-data:/var/lib/clickhouse
      - plausible-clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  plausible-postgres-data:
  plausible-clickhouse-data:
  plausible-clickhouse-logs:
