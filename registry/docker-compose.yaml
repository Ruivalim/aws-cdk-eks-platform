# Docker Registry - Private image registry
# Docs: https://docs.docker.com/registry/
#
# Para gerar o hash da senha:
#   htpasswd -nb admin suasenha | sed 's/\$/\$\$/g'
# Copie o resultado e cole no REGISTRY_AUTH_USERS abaixo

services:
  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    environment:
      - REGISTRY_STORAGE_DELETE_ENABLED=true
    volumes:
      - registry-data:/var/lib/registry
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/v2/"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.registry.rule=Host(`registry.ruivalim.com.br`)"
      - "traefik.http.routers.registry.entrypoints=https"
      - "traefik.http.routers.registry.tls=true"
      - "traefik.http.routers.registry.tls.certresolver=letsencrypt"
      - "traefik.http.services.registry.loadbalancer.server.port=5000"
      - "traefik.http.routers.registry.middlewares=registry-auth"
      - "traefik.http.middlewares.registry-auth.basicauth.users=admin:$$apr1$$M50pvMod$$vAFWo7FBVyXWh8c2WrPLq0"

volumes:
  registry-data:
