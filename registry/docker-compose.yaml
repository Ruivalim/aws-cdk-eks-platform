# Docker Registry - Private image registry
# Docs: https://docs.docker.com/registry/
#
# Auth: Configurar via interface do Coolify (Basic Auth) ou usar htpasswd interno
# Para htpasswd interno, descomentar as linhas de REGISTRY_AUTH abaixo

services:
  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    environment:
      - REGISTRY_STORAGE_DELETE_ENABLED=true
      # Auth via htpasswd (descomentar para ativar)
      # - REGISTRY_AUTH=htpasswd
      # - REGISTRY_AUTH_HTPASSWD_REALM=Docker Registry
      # - REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd
    volumes:
      - registry-data:/var/lib/registry
      # - registry-auth:/auth  # Descomentar se usar htpasswd
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/v2/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  registry-data:
  # registry-auth:  # Descomentar se usar htpasswd
