# Redis Insight - Redis GUI
# Access: Private (Tailscale only)
# Docs: https://redis.io/docs/connect/insight/

services:
  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    restart: unless-stopped
    volumes:
      - redis-insight-data:/data
    environment:
      - RIPORT=5540
      - RITRUSTEDORIGINS=${RITRUSTEDORIGINS:-http://localhost:5540}
    ports:
      - "5540:5540"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5540/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis-insight-data:
