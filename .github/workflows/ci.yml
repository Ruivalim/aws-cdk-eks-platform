name: CI

on:
  push:
    branches: [main]
  pull_request:

# The whole pipeline runs without AWS credentials, which matters more here than
# in most CDK projects: an EKS stack that resolved anything live at synth time
# would need account access just to type-check a pull request. Availability
# zones are named explicitly precisely so this does not happen.
permissions:
  contents: read

jobs:
  check:
    name: Lint, build, test and synth
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run fmt:check

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run build

      - name: Test
        run: npm test

      - name: Synthesize CloudFormation
        run: npx cdk synth -c environment=dev

      - name: Fail if the working tree is dirty
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is dirty after the build:"
            git status --porcelain
            exit 1
          fi
