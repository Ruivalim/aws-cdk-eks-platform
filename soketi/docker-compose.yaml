# Soketi - WebSocket Server (Pusher compatible)
# Access: Public (WebSocket connections need public access)
# Docs: https://docs.soketi.app/

services:
  soketi:
    image: quay.io/soketi/soketi:latest
    container_name: soketi
    restart: unless-stopped
    environment:
      # Debug
      - SOKETI_DEBUG=${SOKETI_DEBUG:-0}

      # Default app credentials
      - SOKETI_DEFAULT_APP_ID=${SOKETI_APP_ID:-app-id}
      - SOKETI_DEFAULT_APP_KEY=${SOKETI_APP_KEY:-app-key}
      - SOKETI_DEFAULT_APP_SECRET=${SOKETI_APP_SECRET:-app-secret}
      - SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES=true
      - SOKETI_DEFAULT_APP_ENABLED=true

      # Limits
      - SOKETI_DEFAULT_APP_MAX_CONNS=${SOKETI_MAX_CONNS:-1000}
      - SOKETI_DEFAULT_APP_MAX_BACKEND_EVENTS_PER_SEC=${SOKETI_MAX_EVENTS:-1000}
      - SOKETI_DEFAULT_APP_MAX_CLIENT_EVENTS_PER_SEC=100
      - SOKETI_DEFAULT_APP_MAX_READ_REQ_PER_SEC=100

      # SSL (handled by Coolify/Traefik)
      - SOKETI_SSL_CERT=
      - SOKETI_SSL_KEY=

      # Metrics (optional)
      - SOKETI_METRICS_ENABLED=${SOKETI_METRICS_ENABLED:-false}
      - SOKETI_METRICS_SERVER_PORT=9601
    ports:
      - "6001:6001"   # WebSocket
      - "9601:9601"   # Metrics (optional)
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6001"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Redis adapter for horizontal scaling
