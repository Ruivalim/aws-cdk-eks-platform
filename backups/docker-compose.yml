# Backups - Volume and PostgreSQL backups to DigitalOcean Spaces
# Access: Internal only
# Docs: https://github.com/offen/docker-volume-backup

services:
  volume-backup:
    image: offen/docker-volume-backup:v2
    container_name: volume-backup
    restart: unless-stopped
    environment:
      - AWS_S3_BUCKET_NAME=${BACKUP_S3_BUCKET}
      - AWS_S3_PATH=${BACKUP_S3_PATH:-backups}/volumes
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_ENDPOINT=${AWS_ENDPOINT}
      - BACKUP_CRON_EXPRESSION=${BACKUP_CRON:-0 3 * * *}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      - BACKUP_COMPRESSION=gz
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Add volumes to backup here (read-only)
      # - some-volume:/backup/some-volume:ro

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: postgres-backup
    restart: unless-stopped
    environment:
      # Comma-separated list of hosts (container names or Tailscale IPs)
      - POSTGRES_HOST=${POSTGRES_HOSTS:-postgres}
      - POSTGRES_DB=${POSTGRES_DBS:-all}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_EXTRA_OPTS=${POSTGRES_EXTRA_OPTS:--Z6 --blobs}
      - SCHEDULE=${POSTGRES_BACKUP_CRON:-0 3 * * *}
      - BACKUP_KEEP_DAYS=${POSTGRES_BACKUP_RETENTION_DAYS:-7}
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    volumes:
      - postgres-backups:/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres-backup-s3-sync:
    image: amazon/aws-cli:latest
    container_name: postgres-backup-s3-sync
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          echo "[$(date)] Syncing postgres backups to S3..."
          aws s3 sync /backups s3://${BACKUP_S3_BUCKET}/${BACKUP_S3_PATH:-backups}/postgres --delete
          echo "[$(date)] Sync complete. Next sync in 1 hour."
          sleep 3600
        done
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_REGION:-nyc3}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET}
      - BACKUP_S3_PATH=${BACKUP_S3_PATH:-backups}
    volumes:
      - postgres-backups:/backups:ro
    depends_on:
      - postgres-backup

volumes:
  postgres-backups:
