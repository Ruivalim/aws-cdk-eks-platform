# GitHub Actions Runner - Self-hosted
# Docs: https://github.com/myoung34/docker-github-actions-runner
#
# Configurar no GitHub:
# 1. Repo → Settings → Actions → Runners → New self-hosted runner
# 2. Copiar o token e colocar no .env
#
# Variáveis necessárias (.env):
#   GITHUB_ACCESS_TOKEN=ghp_xxx (Personal Access Token com repo scope)
#   RUNNER_REPOSITORY_URL=https://github.com/user/repo
#   ou
#   RUNNER_ORGANIZATION_URL=https://github.com/org (runner pra org inteira)

services:
  runner:
    image: myoung34/github-runner:latest
    restart: unless-stopped
    environment:
      - RUNNER_NAME=${RUNNER_NAME:-coolify-runner}
      - RUNNER_WORKDIR=/tmp/runner/work
      - RUNNER_SCOPE=${RUNNER_SCOPE:-repo}
      # Para repo específico:
      - REPO_URL=${RUNNER_REPOSITORY_URL:-}
      # Para organização:
      - ORG_NAME=${RUNNER_ORGANIZATION_URL:-}
      # Token de acesso
      - ACCESS_TOKEN=${GITHUB_ACCESS_TOKEN}
      # Labels do runner
      - LABELS=${RUNNER_LABELS:-self-hosted,coolify,docker}
      # Efemero (recria após cada job) - recomendado
      - EPHEMERAL=${RUNNER_EPHEMERAL:-false}
      - DISABLE_AUTO_UPDATE=true
    volumes:
      # Docker socket pra buildar imagens
      - /var/run/docker.sock:/var/run/docker.sock
      # Workspace persistente
      - runner-work:/tmp/runner/work
    healthcheck:
      test: ["CMD", "pgrep", "-x", "Runner.Listener"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  runner-work:
